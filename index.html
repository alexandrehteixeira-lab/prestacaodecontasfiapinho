<script>
const D=JSON.parse(document.getElementById('data').textContent);
const CATS=['Consulta veterinária','Procedimento veterinário','Exames','Alimentação','Medicamentos','Outros'];
const R=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=s=>s?s.split('-').reverse().join('/'):'';
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let owner=false,art=null;

function shrink(f){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.65))};i.onerror=no;i.src=u})}

async function proc(files){
  const rc=[];
  for(const x of files){
    try{
      if(x.type==='application/pdf'||/\.pdf$/i.test(x.name)){
        const as=await claude.use('assets');
        if(!as){alert('O envio de PDF não está disponível agora. Use uma foto ou print.');continue}
        const r=await as.upload(x);rc.push({u:'/_blob/'+r.id,id:r.id,n:x.name});
      }else rc.push(await shrink(x));
    }catch(e){alert('Não foi possível anexar "'+x.name+'".')}
  }
  return rc}

function zoom(src){const lb=document.getElementById('lb');lb.innerHTML='';const im=el('img');im.src=src;lb.append(im);lb.style.display='flex';lb.onclick=()=>{lb.style.display='none';lb.innerHTML=''}}

async function save(){
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  clone.querySelectorAll('[data-r]').forEach(e=>{e.innerHTML='';e.removeAttribute('style')});
  try{await art.publish('<!doctype html>\n'+clone.outerHTML)}
  catch(e){alert('Não foi possível salvar agora ('+(e&&(e.code||e.message)||'erro')+'). Tente de novo.');render()}
}

function list(title,arr,key){
  const s=el('section','card');s.append(el('h2','',title));
  if(!arr.length)s.append(el('p','mu','Nada registrado ainda.'));
  [...arr].sort((a,b)=>b.d.localeCompare(a.d)).forEach(x=>{
    const r=el('div','row'),t=el('div','top'),m=el('div');
    m.append(el('b','',key==='expenses'?x.c+' – '+x.t:(x.t||'Doação anônima')));
    m.append(el('br'),el('small','',dt(x.d)));
    if(owner){const d=el('button','del','excluir');d.onclick=async()=>{if(confirm('Excluir este registro?')){D[key]=D[key].filter(y=>y.id!==x.id);D.up=new Date().toISOString();await save()}};m.append(d)}
    t.append(m,el('span','val',(key==='expenses'?'− ':'+ ')+R(x.v)));r.append(t);
    if(x.rc&&x.rc.length){const w=el('div','ths');x.rc.forEach((src,i)=>{const q=el('div');if(typeof src==='object'){const a=el('a','th pdf');a.href=src.u;a.target='_blank';a.rel='noopener';a.append(el('b','','📄'),el('span','',src.n||'PDF'));q.append(a)}else{const im=el('img','th');im.src=src;im.alt='Comprovante';im.onclick=()=>zoom(src);q.append(im)}if(owner){const d=el('button','del','remover');d.onclick=async()=>{if(confirm('Remover este comprovante?')){const gone=x.rc.splice(i,1)[0];if(gone&&gone.id){try{const as=await claude.use('assets');if(as)await as.delete(gone.id)}catch(e){}}D.up=new Date().toISOString();await save()}};q.append(el('br'),d)}w.append(q)});r.append(w)}
    else if(owner&&key==='expenses')r.append(el('small','','⚠ sem comprovante ainda'));
    s.append(r)});
  return s}

function form(title,isE){
  const f=el('div','f');f.append(el('h3','',title));
  const d=el('input');d.type='date';d.value=new Date().toISOString().slice(0,10);
  let c;if(isE){c=el('select');CATS.forEach(k=>c.add(new Option(k)))}
  const t=el('input');t.placeholder=isE?'Descrição (ex.: raio-X da pata)':'Nome do doador (opcional)';
  const v=el('input');v.type='number';v.step='0.01';v.min='0';v.placeholder='Valor em R$';
  const fl=el('input');fl.type='file';fl.accept='image/*,application/pdf';fl.multiple=true;
  const b=el('button','btn','Adicionar e publicar');
  b.onclick=async()=>{
    const n=parseFloat(v.value);
    if(!d.value||!(n>0)||(isE&&!t.value.trim()))return alert('Preencha data, descrição e valor.');
    b.disabled=true;b.textContent='Salvando…';
    const rc=await proc(fl.files);
    const it={id:Date.now(),d:d.value,t:t.value.trim(),v:n,rc};if(isE)it.c=c.value;
    D[isE?'expenses':'donations'].push(it);D.up=new Date().toISOString();await save()};
  f.append(d);if(isE)f.append(c);
  f.append(t,v,el('small','mu','Comprovante (foto, print ou PDF – pode escolher vários)'),fl,b);
  return f}

function rcForm(){
  const f=el('div','f');f.append(el('h3','','Adicionar comprovantes a um gasto já registrado'));
  if(!D.expenses.length){f.append(el('p','mu','Cadastre um gasto primeiro.'));return f}
  const s=el('select');
  [...D.expenses].sort((a,b)=>b.d.localeCompare(a.d)).forEach(x=>s.add(new Option(dt(x.d)+' – '+x.c+' – '+x.t+' ('+R(x.v)+')',x.id)));
  const fl=el('input');fl.type='file';fl.accept='image/*,application/pdf';fl.multiple=true;
  const b=el('button','btn','Anexar comprovantes e publicar');
  b.onclick=async()=>{
    if(!fl.files.length)return alert('Escolha ao menos uma foto, print ou PDF.');
    b.disabled=true;b.textContent='Salvando…';
    const rc=await proc(fl.files);
    const it=D.expenses.find(x=>String(x.id)===s.value);it.rc=(it.rc||[]).concat(rc);D.up=new Date().toISOString();await save()};
  f.append(el('small','mu','Escolha o gasto e anexe a foto, print ou PDF do comprovante de pagamento/transferência'),s,fl,b);
  return f}

function render(){
  const app=document.getElementById('app');app.innerHTML='';
  const tot=D.donations.reduce((a,x)=>a+x.v,0),gas=D.expenses.reduce((a,x)=>a+x.v,0);
  const g=el('div','grid');
  [['Arrecadado',tot,''],['Gasto',gas,''],['Saldo',tot-gas,'ok']].forEach(([l,v,c])=>{const k=el('div','card k '+c);k.append(el('small','',l),el('b','',R(v)));g.append(k)});
  app.append(g);
  const by={};D.expenses.forEach(x=>by[x.c]=(by[x.c]||0)+x.v);
  const cs=el('section','card');cs.append(el('h2','','Gastos por categoria'));
  if(!gas)cs.append(el('p','mu','Nenhum gasto registrado ainda.'));
  Object.entries(by).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{
    const r=el('div','bar'),w=el('div','trk'),i=el('i');i.style.width=(v/gas*100)+'%';w.append(i);
    r.append(el('span','',c+' · '+R(v)),w);cs.append(r)});
  app.append(cs,list('Gastos e comprovantes',D.expenses,'expenses'),list('Doações recebidas',D.donations,'donations'));
  if(owner){const s=el('section','card');s.append(el('h2','','Modo edição (só você vê)'),form('Novo gasto',true),rcForm(),form('Nova doação / transferência recebida',false));app.append(s)}
  document.getElementById('ft').textContent=D.up?'Última atualização: '+new Date(D.up).toLocaleString('pt-BR'):'';
}
render();
(async()=>{try{const u=await claude.use('user');art=await claude.use('artifact');owner=!!(u&&u.isOwner()&&art);if(owner)render()}catch(e){}})();
</script>
